name: Increment downloads and views

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Add 2 downloads and 2 views
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          DOWNLOADS: "2"
          VIEWS: "2"
        run: node scripts/increment-activity.mjs
