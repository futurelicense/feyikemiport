name: Increment downloads and views

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Check optional Supabase configuration
        id: configuration
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        shell: bash
        run: |
          if [[ -z "${SUPABASE_URL//[[:space:]]/}" || -z "${SUPABASE_SECRET_KEY//[[:space:]]/}" ]]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Activity increment skipped::Configure both SUPABASE_URL and SUPABASE_SECRET_KEY in repository Actions secrets to enable optional counter increments."
            cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          ### Activity increment skipped
          The optional counter increment is not configured. Add both `SUPABASE_URL` and `SUPABASE_SECRET_KEY` in **Settings > Secrets and variables > Actions** to enable it.

          No counters were changed. Normal website activity tracking is independent of this workflow.
          SUMMARY
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.configuration.outputs.configured == 'true'
      - uses: actions/setup-node@v4
        if: steps.configuration.outputs.configured == 'true'
        with:
          node-version: "22"
      - name: Add 2 downloads and 2 views
        if: steps.configuration.outputs.configured == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          DOWNLOADS: "2"
          VIEWS: "2"
        run: node scripts/increment-activity.mjs
